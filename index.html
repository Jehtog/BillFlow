<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BillFlow Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root { --bg: #f2f2f7; --card: #ffffff; --biz: #007aff; --priv: #8e8e93; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100dvh; background: var(--bg); overflow: hidden; }
        #app { height: 100dvh; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; position: relative; }
        
        .header { padding: calc(env(safe-area-inset-top) + 20px) 20px 10px; background: var(--bg); }
        .summary-row { display: flex; gap: 10px; padding: 0 20px 15px; }
        .summary-box { flex: 1; background: #fff; padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; text-align: center; border: 1px solid #e5e5ea; }
        
        .scroll-body { flex: 1; overflow-y: auto; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
        .card { background: var(--card); margin: 8px 16px; padding: 16px; border-radius: 12px; border: 1px solid #e5e5ea; display: flex; justify-content: space-between; align-items: center; }
        
        .nav { position: absolute; bottom: 0; width: 100%; height: calc(70px + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 1px solid #e5e5ea; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .fab { background: #000; color: #fff; width: 50px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-top: -20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .screen { display: none; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }
        .filter-btn { padding: 6px 14px; border-radius: 15px; border: none; background: #e5e5ea; font-size: 12px; font-weight: 600; }
        .filter-btn.active { background: #000; color: #fff; }
    </style>
</head>
<body>
<div id="app">
    <div class="screen active" id="s-dash">
        <div class="header">
            <h1>BillFlow</h1>
            <div style="margin: 12px 0; display:flex; gap:6px;">
                <button class="filter-btn active" id="btn-all" onclick="setFilter('all')">All</button>
                <button class="filter-btn" id="btn-biz" onclick="setFilter('biz')">Business</button>
                <button class="filter-btn" id="btn-priv" onclick="setFilter('priv')">Private</button>
            </div>
        </div>
        <div class="summary-row">
            <div class="summary-box">BIZ TOTAL: <span id="sum-biz">€0</span></div>
            <div class="summary-box">PRIV TOTAL: <span id="sum-priv">€0</span></div>
        </div>
        <div class="scroll-body" id="list"></div>
    </div>
    
    <div class="screen" id="s-data">
        <div class="header"><h1>Analytics</h1></div>
        <div class="scroll-body"><div class="card"><canvas id="bizChart"></canvas></div></div>
    </div>

    <div class="nav">
        <div onclick="switchS('dash')">📊</div>
        <div class="fab" onclick="document.getElementById('img-input').click()">＋</div>
        <div onclick="switchS('data')">📈</div>
    </div>
    <input type="file" id="img-input" accept="image/*" capture="environment" style="display:none" onchange="scanImage(event)">
</div>

<script>
    let rawData = JSON.parse(localStorage.getItem('bf_master')) || [];
    let filter = 'all';
    
    // Auto-save Proxy
    const data = new Proxy(rawData, {
        set(target, prop, val) { target[prop] = val; localStorage.setItem('bf_master', JSON.stringify(target)); render(); return true; }
    });

    function setFilter(f) {
        filter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+f).classList.add('active');
        render();
    }

    function render() {
        const filtered = data.filter(i => filter === 'all' ? true : (filter === 'biz' ? i.isBiz : !i.isBiz));
        const list = document.getElementById('list');
        list.innerHTML = filtered.map(i => `
            <div class="card" style="border-left: 5px solid ${i.isBiz ? 'var(--biz)' : 'var(--priv)'}">
                <div><strong>${i.vendor}</strong><br><small>${i.isBiz ? 'Business' : 'Private'}</small></div>
                <div style="font-weight:700;">€${parseFloat(i.amount).toFixed(2)}</div>
            </div>`).join('');

        document.getElementById('sum-biz').innerText = '€' + data.filter(i=>i.isBiz).reduce((a,b)=>a+parseFloat(b.amount),0).toFixed(0);
        document.getElementById('sum-priv').innerText = '€' + data.filter(i=>!i.isBiz).reduce((a,b)=>a+parseFloat(b.amount),0).toFixed(0);
    }

    async function scanImage(e) {
        const { data: { text } } = await Tesseract.recognize(e.target.files[0], 'eng');
        const amount = text.match(/\d+\.\d{2}/) ? text.match(/\d+\.\d{2}/)[0] : "0.00";
        if(confirm("Scanned €" + amount + ". Is this Business?")) {
            data.push({ vendor: "Scanned Item", amount, isBiz: true });
        } else {
            data.push({ vendor: "Scanned Item", amount, isBiz: false });
        }
    }

    function switchS(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('s-'+id).classList.add('active');
    }
    render();
</script>
</body>
</html>
