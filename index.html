<script>

// =========================

// SAFE INITIALISATION

// =========================

let invoices = [];

try {

    const stored = localStorage.getItem('bf2');

    invoices = stored ? JSON.parse(stored) : [];

} catch (e) {

    console.error("LocalStorage parse error:", e);

    invoices = [];

}

// =========================

// SAFE SAVE FUNCTION WRAPPER

// =========================

function safeSave() {

    try {

        localStorage.setItem('bf2', JSON.stringify(invoices));

    } catch (e) {

        console.error("Save failed:", e);

    }

}

// =========================

// PROXY (SAFE VERSION)

// =========================

const invoicesProxy = new Proxy(invoices, {

    set(target, prop, value) {

        target[prop] = value;

        safeSave();

        if (typeof renderAll === "function") {

            try {

                renderAll();

            } catch (e) {

                console.error("renderAll error:", e);

            }

        }

        return true;

    }

});

// IMPORTANT: replace old array reference

invoices = invoicesProxy;

// =========================

// OCR FUNCTION (SAFE)

// =========================

async function parseImageText(imgData) {

    const ss = document.getElementById('scan-status');

    if (ss) {

        ss.style.display = 'block';

        ss.textContent = '⏳ Reading your document…';

    }

    // Check OCR exists

    if (typeof Tesseract === "undefined") {

        console.error("Tesseract not loaded");

        if (ss) ss.textContent = "❌ OCR library missing";

        return;

    }

    try {

        const result = await Tesseract.recognize(imgData, 'eng');

        const text = result?.data?.text || "";

        const amountMatch = text.match(/\d+\.\d{2}/);

        if (amountMatch) {

            const field = document.getElementById('f-amt');

            if (field) field.value = amountMatch[0];

            if (ss) {

                ss.textContent = '✅ Found amount: €' + amountMatch[0];

                ss.style.background = 'var(--green-bg)';

            }

        } else {

            if (ss) ss.textContent = '⚠️ No amount detected.';

        }

    } catch (err) {

        console.error(err);

        if (ss) ss.textContent = '❌ OCR Error';

    }

}

</script>
