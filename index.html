l<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>BillFlow Pro</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0a0a0f; --bg3: #18181f; --text: #f0f0f5; --blue: #4f8ef7; --green: #2ecc7a; --red: #ff3b5c;
    /* 14 Pro Max safe area fixes */
    --safe-top: env(safe-area-inset-top, 47px);
    --safe-bottom: env(safe-area-inset-bottom, 34px);
  }
  body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
  #app { height: calc(100dvh - var(--safe-top) - var(--safe-bottom)); display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
  .scroll-body { flex: 1; overflow-y: auto; padding: 20px; }
  /* Ensure components respect screen width */
  .form-input { width: 100%; background: var(--bg3); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; color: white; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app">
  <div class="scroll-body" id="main-view">
    <div id="dashboard-content">
      <h1 id="view-title">Dashboard</h1>
      <button onclick="toggleView()" style="padding:10px; border-radius:10px; margin-bottom:10px;">Switch Calendar/List</button>
      <div id="display-area"></div>
    </div>
  </div>
</div>

<script>
let invoices = JSON.parse(localStorage.getItem('bf_invoices')) || [];
let isCalendarView = false;

function toggleView() {
  isCalendarView = !isCalendarView;
  refreshUI();
}

function refreshUI() {
  const area = document.getElementById('display-area');
  if (isCalendarView) {
    // Calendar View: Sort by date
    const sorted = [...invoices].sort((a,b) => new Date(a.due) - new Date(b.due));
    area.innerHTML = sorted.map(i => `<div style="padding:15px; border-bottom:1px solid #333">${i.due} | ${i.vendor} - €${i.amount}</div>`).join('');
  } else {
    // List View
    area.innerHTML = invoices.map(i => `<div style="padding:15px; background:#18181f; margin-bottom:5px; border-radius:10px">${i.vendor} - €${i.amount}</div>`).join('');
  }
}

function saveInvoice() {
  const inv = {
    id: Date.now(),
    vendor: document.getElementById('f-vendor').value,
    amount: document.getElementById('f-amount').value,
    due: document.getElementById('f-due').value,
    iban: document.getElementById('f-iban').value, // NEW
    exp: document.getElementById('f-exp').value,   // NEW
    type: document.getElementById('f-type').value, // NEW
    status: 'pending'
  };
  invoices.push(inv);
  localStorage.setItem('bf_invoices', JSON.stringify(invoices));
  refreshUI();
}
</script>

</body>
</html>
