<script>
// 1. AUTO-SAVE PROXY (Add this right after your 'invoices' array declaration)
let invoices = JSON.parse(localStorage.getItem('bf2')||'null')||[/* ...your default data... */];

const invoicesProxy = new Proxy(invoices, {
    set(target, prop, value) {
        target[prop] = value;
        save(); // Triggers your original save function automatically
        renderAll(); // Refreshes the UI automatically
        return true;
    }
});
// Replace all references of 'invoices' with 'invoicesProxy' in your functions.

// 2. OCR INTEGRATION (Update your existing parseImageText function)
async function parseImageText(imgData) {
    const ss = document.getElementById('scan-status');
    ss.style.display = 'block';
    ss.textContent = '⏳ Reading your document…';

    try {
        const { data: { text } } = await Tesseract.recognize(imgData, 'eng');
        const amountMatch = text.match(/\d+\.\d{2}/);
        
        if (amountMatch) {
            document.getElementById('f-amt').value = amountMatch[0];
            ss.textContent = '✅ Found amount: €' + amountMatch[0] + '. Please verify fields.';
            ss.style.background = 'var(--green-bg)';
        } else {
            ss.textContent = '⚠️ Could not auto-read amount. Please enter manually.';
        }
    } catch (err) {
        ss.textContent = '❌ OCR Error. Please enter manually.';
    }
}
</script>
