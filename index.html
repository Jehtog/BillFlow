<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>BillFlow</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
  :root { --bg:#0a0a0f; --bg3:#18181f; --text:#f0f0f5; --blue:#4f8ef7; --green:#2ecc7a; --red:#ff3b5c; --radius:18px; }
  body { background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, sans-serif; margin:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); height:100dvh; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; max-width:480px; margin:0 auto; }
  .scroll-body { flex:1; overflow-y:auto; padding:16px; }
  .calendar-container { background:var(--bg3); padding:16px; border-radius:var(--radius); margin-bottom:20px; }
  .form-input { width:100%; background:var(--bg3); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px; color:white; margin-bottom:10px; }
  .invoice-row { background:var(--bg3); padding:14px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div id="app">
  <div class="scroll-body">
    <div class="calendar-container">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:700;">
        <span onclick="changeMonth(-1)">◀</span>
        <span id="month-label"></span>
        <span onclick="changeMonth(1)">▶</span>
      </div>
      <div id="calendar-days" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; text-align:center;"></div>
    </div>
    
    <div id="invoice-list"></div>
    <button onclick="document.getElementById('modal-add').style.display='block'" style="width:100%; padding:15px; border-radius:14px; background:var(--blue); border:none; color:white; font-weight:bold;">+ Add Invoice</button>
  </div>
</div>

<div id="modal-add" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); padding:20px; z-index:100;">
  <h3>Add Invoice</h3>
  <input type="text" id="f-vendor" class="form-input" placeholder="Vendor">
  <input type="number" id="f-amount" class="form-input" placeholder="Amount">
  <input type="date" id="f-due" class="form-input">
  <input type="text" id="f-iban" class="form-input" placeholder="IBAN">
  <input type="date" id="f-exp" class="form-input" placeholder="Expiry Date">
  <select id="f-type" class="form-input"><option value="private">Private</option><option value="business">Business</option></select>
  <button onclick="saveInvoice()" class="form-input" style="background:var(--green)">Save</button>
  <button onclick="this.parentElement.style.display='none'" class="form-input">Cancel</button>
</div>

<script>
let invoices = JSON.parse(localStorage.getItem('bf_invoices')) || [];
let currentMonth = new Date();

function renderCalendar() {
  const grid = document.getElementById('calendar-days');
  const monthLabel = document.getElementById('month-label');
  grid.innerHTML = '';
  monthLabel.textContent = currentMonth.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth()+1, 0).getDate();
  for(let d=1; d<=daysInMonth; d++) {
    grid.innerHTML += `<div style="padding:5px; font-size:12px;">${d}</div>`;
  }
}

function refreshUI() {
  document.getElementById('invoice-list').innerHTML = invoices.map(i => `
    <div class="invoice-row">
      <div>${i.vendor}<br><small style="color:#888">${i.iban || 'No IBAN'}</small></div>
      <div>€${i.amount}<br><small>${i.type}</small></div>
    </div>`).join('');
  renderCalendar();
}

function saveInvoice() {
  invoices.push({
    vendor: document.getElementById('f-vendor').value,
    amount: document.getElementById('f-amount').value,
    due: document.getElementById('f-due').value,
    iban: document.getElementById('f-iban').value,
    exp: document.getElementById('f-exp').value,
    type: document.getElementById('f-type').value
  });
  localStorage.setItem('bf_invoices', JSON.stringify(invoices));
  document.getElementById('modal-add').style.display = 'none';
  refreshUI();
}

function changeMonth(delta) { currentMonth.setMonth(currentMonth.getMonth() + delta); renderCalendar(); }
refreshUI();
</script>
</body>
</html>
